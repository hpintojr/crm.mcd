name: Isolated Lead Import Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/isolated-lead-import-diagnostics.yml"
      - "scripts/test-lead-import-lifecycle-db.ts"
      - "scripts/test-lead-import-research-fields-db.ts"
      - "src/lib/lead-import-**"
      - "src/lib/import-audit-service.ts"
      - "src/lib/owner-lead-acquisition-provenance.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    name: Signed import lifecycle harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCD_RUN_DB_INTEGRATION_TESTS: "1"
      MCD_TEST_DATABASE_URL: ${{ secrets.MCD_TEST_DATABASE_URL }}
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/mcd_ci_sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: test -n "$MCD_TEST_DATABASE_URL"
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run test:lead-import-db

  research:
    name: Research and opaque-record harness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MCD_RUN_DB_INTEGRATION_TESTS: "1"
      MCD_TEST_DATABASE_URL: ${{ secrets.MCD_TEST_DATABASE_URL }}
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/mcd_ci_sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: test -n "$MCD_TEST_DATABASE_URL"
      - run: npm install --no-audit --no-fund
      - run: npm run prisma:generate
      - run: npm run test:lead-import-research-db
