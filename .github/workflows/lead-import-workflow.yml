name: Lead Import Workflow

on:
  pull_request:
    paths:
      - "src/lib/lead-import-workflow.ts"
      - "scripts/check-lead-import-workflow.ts"
      - ".github/workflows/lead-import-workflow.yml"
  push:
    branches:
      - "rebuild/lead-import-workflow-v2"

permissions:
  contents: read

jobs:
  workflow-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx tsx scripts/check-lead-import-workflow.ts
