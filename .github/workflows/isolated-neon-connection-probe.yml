name: Isolated Database Connection Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/isolated-neon-connection-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      MCD_TEST_DATABASE_URL: ${{ secrets.MCD_TEST_DATABASE_URL }}
    steps:
      - name: Verify isolated database connectivity and schema marker
        shell: bash
        run: |
          test -n "$MCD_TEST_DATABASE_URL"
          psql "$MCD_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -tAc "SELECT current_database(), EXISTS (SELECT 1 FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'OwnerLeadAcquisitionProvenance');"
