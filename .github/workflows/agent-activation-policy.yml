name: Agent Activation Policy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  activation-policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npx tsx scripts/check-agent-activation-policy.ts
