name: Lead Import Contract

on:
  pull_request:
    paths:
      - "src/lib/lead-import-contract.ts"
      - "src/lib/lead-import-auth.ts"
      - "src/lib/lead-import-payload-schema.ts"
      - "scripts/check-lead-import-contract.ts"
      - "package.json"
      - ".github/workflows/lead-import-contract.yml"
  push:
    branches:
      - "rebuild/lead-import-contract-slice-a"

permissions:
  contents: read

jobs:
  contract-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check:lead-import-contract
